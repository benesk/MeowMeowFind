<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>MeowMeowFind Pro</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --text-color: #4a3e3d;
            --accent-pink: #ffb6c1;
            --accent-green: #baffc9;
        }
        
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100dvh; /* Enforces strict dynamic viewport lock */
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: '-apple-system', BlinkMacSystemFont, sans-serif;
            overflow: hidden; /* Prevents bouncing and scrolling completely */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Strict App Shell layout that guarantees nothing goes off-screen */
        .app-shell {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            width: 100%;
            height: 100%;
            padding: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            background: rgba(0,0,0,0.03);
            padding: 6px;
            border-radius: 8px;
        }
        select, .mode-btn {
            padding: 6px 10px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 2px solid var(--text-color);
            border-radius: 6px;
            background: white;
        }

        /* TOOL TOGGLE BAR - Replaces confusing gestures */
        .tool-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 5px 0;
        }
        .mode-btn {
            cursor: pointer;
            font-size: 1rem;
            padding: 8px 20px;
            box-shadow: 0 3px 0 var(--text-color);
            transition: all 0.1s ease;
        }
        .mode-btn.active {
            background-color: var(--accent-pink);
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--text-color);
        }

        .grid-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-height: 0; /* Critical CSS fix for grid nesting */
        }

        #grid-container {
            padding: 4px;
            background-color: var(--text-color);
            border-radius: 8px;
            width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
        }

        #grid {
            display: grid;
            gap: 2px;
            width: 100%;
            height: 100%;
            touch-action: none; /* Block native gestures completely inside layout zone */
        }

        .cell {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .cell.hint-flash { animation: flash 0.4s alternate 4; }
        @keyframes flash { from { background-color: white; } to { background-color: #fef0ad; } }

        .footer-deck {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-top: 10px;
        }
        .message { font-weight: bold; min-height: 20px; font-size: 0.95rem; }
        .action-btns {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .btn {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 2px solid var(--text-color);
            border-radius: 20px;
            box-shadow: 0 4px 0 var(--text-color);
            background-color: white;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--text-color); }
        .btn:disabled { opacity: 0.4; box-shadow: 0 4px 0 var(--text-color) !important; transform: none; }
        #hintBtn { background-color: #fef0ad; }

        .c-0 { background-color: #ffdfba; } .c-1 { background-color: #baffc9; }
        .c-2 { background-color: #bae1ff; } .c-3 { background-color: #e8bae7; }
        .c-4 { background-color: #ffffba; } .c-5 { background-color: #ffb3ba; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="header">
            <h1>🐱 MeowMeowFind</h1>
            <div id="hearts">❤️❤️❤️</div>
        </div>

        <div class="game-controls">
            <select id="sizeSelect" onchange="startNewGame()">
                <option value="5" selected>5 x 5</option>
                <option value="6">6 x 6</option>
            </select>
            <div class="tool-bar">
                <button id="toolX" class="mode-btn active" onclick="setTool('X')">✖ Mark</button>
                <button id="toolCat" class="mode-btn" onclick="setTool('Cat')">🐱 Cat</button>
            </div>
        </div>

        <div class="grid-stage">
            <div id="grid-container">
                <div id="grid"></div>
            </div>
        </div>

        <div class="footer-deck">
            <div id="message" class="message"></div>
            <div class="action-btns">
                <button class="btn" onclick="startNewGame()">New Game</button>
                <button id="hintBtn" class="btn" onclick="getHint()">Hint</button>
            </div>
        </div>
    </div>

    <script>
        let gridSize = 5;
        let activeTool = 'X'; // Default tool state
        let boardLayout = [];
        let solution = [];
        let playerBoard = []; // 0=Empty, 1=X, 2=Cat
        let lives = 3;
        let gameOver = false;

        const grid = document.getElementById('grid');
        const message = document.getElementById('message');
        const hintBtn = document.getElementById('hintBtn');

        function setTool(tool) {
            activeTool = tool;
            document.getElementById('toolX').classList.toggle('active', tool === 'X');
            document.getElementById('toolCat').classList.toggle('active', tool === 'Cat');
        }

        function startNewGame() {
            gridSize = parseInt(document.getElementById('sizeSelect').value);
            lives = 3;
            gameOver = false;
            message.textContent = "";
            document.getElementById('hearts').textContent = "❤️❤️❤️";
            
            // Simple deterministic Generation Engine for testing placement structure
            solution = Array(gridSize).fill(null).map(() => Array(gridSize).fill(false));
            boardLayout = Array(gridSize).fill(null).map(() => Array(gridSize).fill(0));
            playerBoard = Array(gridSize).fill(null).map(() => Array(gridSize).fill(0));
            
            for(let i=0; i<gridSize; i++) {
                solution[i][i] = true; // Set logical diagonal solution matrix
                for(let j=0; j<gridSize; j++) {
                    boardLayout[i][j] = i; // Group coloration zones by row partitions
                }
            }
            renderBoard();
        }

        function renderBoard() {
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            for(let r=0; r<gridSize; r++) {
                for(let c=0; c<gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell c-${boardLayout[r][c]}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    if(playerBoard[r][c] === 1) cell.textContent = '✖';
                    if(playerBoard[r][c] === 2) cell.textContent = '🐱';
                    
                    // Simple programmatic tap handler replaces messy touch systems
                    cell.addEventListener('pointerdown', () => handleCellTap(r, c));
                    grid.appendChild(cell);
                }
            }
        }

        function handleCellTap(r, c) {
            if(gameOver) return;

            if(activeTool === 'X') {
                if(playerBoard[r][c] === 2) return; // Prevent overwriting animals
                playerBoard[r][c] = playerBoard[r][c] === 1 ? 0 : 1;
            } else {
                // Cat Tool Selected
                if(playerBoard[r][c] === 2) {
                    playerBoard[r][c] = 0;
                } else {
                    if(solution[r][c]) {
                        playerBoard[r][c] = 2;
                        checkWin();
                    } else {
                        lives--;
                        document.getElementById('hearts').textContent = "❤️".repeat(lives) + "🖤".repeat(3-lives);
                        message.textContent = "Oops! Bad position! 🐾";
                        if(lives <= 0) {
                            gameOver = true;
                            message.textContent = "Game Over! 😿";
                        }
                    }
                }
            }
            renderBoard();
        }

        function getHint() {
            if(gameOver) return;
            // Scan array layers for first unrevealed answer item
            for(let r=0; r<gridSize; r++) {
                for(let c=0; c<gridSize; c++) {
                    if(solution[r][c] && playerBoard[r][c] !== 2) {
                        const cell = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                        cell.classList.add('hint-flash');
                        message.textContent = "A hidden cat belongs in the flashing box!";
                        setTimeout(() => cell.classList.remove('hint-flash'), 1600);
                        return;
                    }
                }
            }
        }

        startNewGame();
    </script>
</body>
</html>
